name: Build and release
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: check
        name: Check existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF#refs/tags/}" != "$tag" ]]; then
            echo "Il tag deve corrispondere alla versione in package.json: $tag"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$(gh release view "$tag" --json isPrerelease --jq .isPrerelease)" == "true" ]]; then
              gh release edit "$tag" --prerelease=false --latest --notes-file RELEASE_NOTES.md
              echo "Release $tag pubblicata come release normale; pacchetti conservati."
            fi
            assets="$(gh release view "$tag" --json assets --jq '[.assets[].name] | sort | join(",")')"
            if [[ "$assets" == "iDom-Launcher-Windows.exe,iDom-Launcher-macOS.dmg" ]]; then
              echo "build=false" >> "$GITHUB_OUTPUT"
            else
              echo "build=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: release-check
    if: needs.release-check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: build:mac
          - os: windows-latest
            command: build:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run ${{ matrix.command }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Verify universal Mac executable
        if: runner.os == 'macOS'
        run: |
          lipo "dist/mac-universal/iDom Launcher.app/Contents/MacOS/iDom Launcher" -verify_arch x86_64 arm64
          lipo "dist/mac-universal/iDom Launcher.app/Contents/Frameworks/Electron Framework.framework/Versions/A/Electron Framework" -verify_arch x86_64 arm64
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/iDom-Launcher-macOS.dmg
            dist/iDom-Launcher-Windows.exe
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Publish versioned release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF#refs/tags/}" != "$tag" ]]; then
            echo "Il tag deve corrispondere alla versione in package.json: $tag"
            exit 1
          fi
          test -s release-assets/iDom-Launcher-macOS.dmg
          test -s release-assets/iDom-Launcher-Windows.exe
          sha256sum release-assets/iDom-Launcher-macOS.dmg release-assets/iDom-Launcher-Windows.exe
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/iDom-Launcher-macOS.dmg release-assets/iDom-Launcher-Windows.exe --clobber
          else
            gh release create "$tag" release-assets/iDom-Launcher-macOS.dmg release-assets/iDom-Launcher-Windows.exe \
              --target "$GITHUB_SHA" \
              --title "iDom Launcher ${version}" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
          # Remove obsolete downloads only after both replacement installers are uploaded.
          gh release view "$tag" --json assets --jq '.assets[].name' > uploaded-assets.txt
          grep -Fxq 'iDom-Launcher-macOS.dmg' uploaded-assets.txt
          grep -Fxq 'iDom-Launcher-Windows.exe' uploaded-assets.txt
          while IFS= read -r asset; do
            if [[ "$asset" != "iDom-Launcher-macOS.dmg" && "$asset" != "iDom-Launcher-Windows.exe" ]]; then
              gh release delete-asset "$tag" "$asset" --yes
            fi
          done < uploaded-assets.txt
          gh release edit "$tag" --prerelease=false --latest --title "iDom Launcher ${version}" --notes-file RELEASE_NOTES.md
          count="$(gh release view "$tag" --json assets --jq '.assets | length')"
          test "$count" -eq 2
